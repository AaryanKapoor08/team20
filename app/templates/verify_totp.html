{% extends "base.html" %}

{% block title %}Enter your code{% endblock %}

{% block content %}
<div class="card">
    <h1 class="card-title">One more step</h1>
    <p class="card-note">This login looks different from your usual ones. Enter the 6-digit code from your authenticator app.</p>

    {% if error %}
    <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('step_up.verify_totp') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label for="code">Code</label>
            <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
                   pattern="[0-9]{6}" maxlength="6" required autofocus>
        </div>
        <button type="submit" class="wide-button">Check code</button>
    </form>

    <p class="form-footer"><a href="{{ url_for('login') }}">Back to log in</a></p>
</div>
{% endblock %}
