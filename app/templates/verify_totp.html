{% extends "base.html" %}

{% block title %}Enter your code{% endblock %}

{% block content %}
<h1>One more step</h1>
<p>This login looks different from your usual ones. Enter the 6-digit code from your authenticator app.</p>

{% if error %}
<p role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('verify_totp') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>
        <label for="code">Code</label><br>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" required autofocus>
    </p>
    <button type="submit">Check code</button>
</form>

<p><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
