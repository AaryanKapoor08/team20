[project]
name = "team20"
version = "0.1.0"
description = "Flask login system that keeps accounts safe after a password is stolen"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "webauthn==3.0.1",
    "cryptography==50.0.2",
]

# Only needed for tests and experiments, not to run the app
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "bcrypt==5.0.0",
    "matplotlib==3.11.2",
]

# Lets tests use `from app import ...`
[tool.pytest.ini_options]
pythonpath = ["."]

# This is an app, not a library, so uv should not try to build or install it
[tool.uv]
package = false
