# Optional second way to run the app: docker compose up
# Nginx is the only way in. Flask has no published port, so it can only be
# reached through Nginx on Docker's private network.

services:
  app:
    build: .
    environment:
      # Trust Nginx's X-Forwarded-For header (only safe because Flask is not published)
      BEHIND_PROXY: "1"
      # The laptop's address inside Docker, so the admin page still opens
      DOCKER_ADMIN_IP: "172.28.0.1"
    networks:
      - inside

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 127.0.0.1 only: other computers on the same Wi-Fi cannot reach it
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - inside

# A fixed address range, so nginx.conf can name the laptop's address (172.28.0.1)
networks:
  inside:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
