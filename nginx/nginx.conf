# Nginx sits in front of Flask (Docker only) and filters traffic before Flask sees it.
# Flask has the same admin allowlist inside, so there are two layers (defense in depth).

events {}

http {
    # Hide the Nginx version number from error pages and headers
    server_tokens off;

    server {
        listen 8000;

        # Settings every forwarded request gets
        proxy_set_header Host $http_host;
        # Overwrite, not append: a visitor cannot slip a fake IP in front of the real one
        proxy_set_header X-Forwarded-For $remote_addr;

        # The admin pages open only from the laptop running Docker.
        # 172.28.0.1 is how the laptop shows up inside Docker (see docker-compose.yml).
        location /admin {
            allow 127.0.0.1;
            allow 172.28.0.1;
            deny all;
            proxy_pass http://app:8000;
        }

        # Every other page goes straight to Flask
        location / {
            proxy_pass http://app:8000;
        }
    }
}
